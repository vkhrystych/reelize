<!-- PROTOTYPE — throwaway (wayfinder ticket 04, caption style).
     Four burned-caption variants on one clip, switchable via ?variant= and ←/→.
     Clip: Lex #494 "Jensen on death" (02:17:28–02:18:14), 9:16 per-shot crop. -->
<!doctype html>
<meta charset="utf-8" />
<title>Caption style picker — ticket 04</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0d10; color: #eee; font: 15px/1.45 -apple-system, sans-serif;
         display: flex; min-height: 100vh; }
  main { display: flex; gap: 32px; margin: auto; padding: 24px 24px 90px; align-items: center; flex-wrap: wrap; justify-content: center; }
  video { height: min(82vh, 820px); aspect-ratio: 9/16; background: #000; border-radius: 14px; }
  aside { max-width: 380px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .sub { color: #999; margin: 0 0 18px; }
  .variant-note { background: #17171c; border: 1px solid #2a2a32; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .variant-note h2 { font-size: 15px; margin: 0 0 4px; }
  .variant-note p { margin: 0; color: #aaa; }
  .keys { color: #777; font-size: 13px; margin-top: 16px; }
  kbd { background: #222; border-radius: 4px; padding: 1px 6px; border: 1px solid #333; }
  /* floating switcher — deliberately not part of the design being judged */
  .switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; background: #f5f5f7; color: #111;
    border-radius: 999px; padding: 8px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .switcher button { border: 0; background: #111; color: #fff; border-radius: 999px;
    width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
  .switcher .label { min-width: 220px; text-align: center; font-weight: 600; }
</style>

<main>
  <video id="player" controls autoplay muted loop playsinline></video>
  <aside>
    <h1>Ticket 04 — burned-caption style</h1>
    <p class="sub">Same clip, four caption treatments actually burned in via ASS/libass. Unmute for pacing. Which would you post — or which pieces from which?</p>
    <div id="note" class="variant-note"></div>
    <p class="keys"><kbd>←</kbd> <kbd>→</kbd> switch variants · URL is shareable per variant</p>
  </aside>
</main>

<div class="switcher">
  <button id="prev" aria-label="previous">←</button>
  <div class="label" id="label"></div>
  <button id="next" aria-label="next">→</button>
</div>

<script>
  const VARIANTS = {
    A: { name: "Punch — one giant word", note: "One word at a time, Impact, pop-in. Maximum retention pressure; can feel shouty on calm content like this clip." },
    B: { name: "Karaoke — chunk + yellow highlight", note: "3–4 word chunks, active word pops yellow. The CapCut/Opus default look; reads as 'a short' instantly." },
    C: { name: "Clean box — phrase level", note: "Whole phrases, mixed case, dim box, zero animation. Calm and premium; relies on the content to hold attention." },
    D: { name: "Builder — line accumulates", note: "Words stack up into the phrase, newest word green. Word-level energy without hiding context; busiest of the four." },
  };
  const KEYS = Object.keys(VARIANTS);
  const player = document.getElementById("player");
  const label = document.getElementById("label");
  const note = document.getElementById("note");

  function current() {
    const v = new URLSearchParams(location.search).get("variant");
    return KEYS.includes(v) ? v : "A";
  }
  function show(v, keepTime) {
    const t = keepTime ? player.currentTime : 0;
    const url = new URL(location); url.searchParams.set("variant", v);
    history.replaceState(null, "", url);
    player.src = `/variant-${v}.mp4`;
    player.currentTime = t;
    player.play().catch(() => {});
    label.textContent = `${v} — ${VARIANTS[v].name}`;
    note.innerHTML = `<h2>${v} — ${VARIANTS[v].name}</h2><p>${VARIANTS[v].note}</p>`;
  }
  function step(d) {
    const i = (KEYS.indexOf(current()) + d + KEYS.length) % KEYS.length;
    show(KEYS[i], true);
  }
  document.getElementById("prev").onclick = () => step(-1);
  document.getElementById("next").onclick = () => step(1);
  addEventListener("keydown", (e) => {
    if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });
  show(current());
</script>
